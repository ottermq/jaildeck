# Rotates Jail Deck's audit log at the default JAILDECK_AUDIT_LOG (JD-058).
# Edits here survive an upgrade. A log configured elsewhere needs a line of its own.
#
# B: the log is JSON lines, so no rotation message goes into it.
# J: older logs are compressed with bzip2.
# N: no signal. Jail Deck opens the log for each entry and holds nothing open.
#
# logfilename                  [owner:group]  mode  count  size   when  flags
/var/log/jaildeck/audit.log    root:wheel     600   10     10240  *     BJN
